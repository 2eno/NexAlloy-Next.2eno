name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Unit tests
      run: ./gradlew testDebugUnitTest

    - name: Build patch bundles
      run: ./gradlew assembleBundle

    - name: Upload patch bundles
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-ci-bundles
        path: bundles/*/build/outputs/bundle/*.nxb
